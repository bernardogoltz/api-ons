[project]
name = "api-ons"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bernardogoltz", email = "bergoltzx2@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "ipython>=9.17.1",
    "jsonify>=0.5",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
]

[project.scripts]
api-ons = "api_ons:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
